name: Reusable assignment tests

on:
  workflow_call:
    inputs:
      unit:
        description: Assignment unit to test, such as module_01, or all
        required: true
        type: string
      revision:
        description: Git revision to check out
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check for g++
        run: g++ --version

      - name: Run all assignment tests
        if: inputs.unit == 'all'
        run: python -m unittest discover -s tests -p 'test_module_*.py' -v

      - name: Run selected assignment tests
        if: inputs.unit != 'all'
        env:
          UNIT: ${{ inputs.unit }}
        run: |
          if [[ ! "$UNIT" =~ ^module_[0-9]{2}$ ]]; then
            echo "::error::Unit must be module_NN or all."
            exit 1
          fi
          python -m unittest discover -s tests -p "test_${UNIT}.py" -v
